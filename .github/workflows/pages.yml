name: Pages

# The site with the Capycal book under /docs. The book comes from the main
# branch of twiebe/capycal, whose docs workflow triggers this one.
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [docs]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: v0.5.4

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: site

      - uses: actions/checkout@v7
        with:
          repository: twiebe/capycal
          path: capycal
          # Only needed while twiebe/capycal is private
          token: ${{ secrets.CAPYCAL_REPO_TOKEN || github.token }}

      - name: Install mdBook
        run: |
          mkdir -p "$RUNNER_TEMP/mdbook"
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/mdbook"
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"

      - uses: actions/configure-pages@v6

      - name: Build
        run: |
          mkdir _site
          cp -r site/. _site/
          rm -rf _site/.git _site/.github _site/README.md
          mdbook build capycal/docs -d "$PWD/_site/docs"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
