name: Pages

# The site with the Capycal book under /docs and the APT and RPM repositories
# under /packages. The book comes from the main branch of twiebe/capycal,
# whose docs workflow triggers this one; its release workflow does too, so
# the repositories pick up a new release. Every run rebuilds both, since a
# deploy replaces the whole site.
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [docs, release]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: v0.5.4

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # Only the step that signs gets the key itself
      HAS_PACKAGES_KEY: ${{ secrets.PACKAGES_GPG_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: site

      - uses: actions/checkout@v7
        with:
          repository: twiebe/capycal
          path: capycal
          # Only needed while twiebe/capycal is private
          token: ${{ secrets.CAPYCAL_REPO_TOKEN || github.token }}

      - name: Install mdBook
        run: |
          mkdir -p "$RUNNER_TEMP/mdbook"
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/mdbook"
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"

      - uses: actions/configure-pages@v6

      - name: Build
        run: |
          mkdir _site
          cp -r site/. _site/
          rm -rf _site/.git _site/.github _site/.gitignore _site/README.md _site/Makefile _site/scripts
          mdbook build capycal/docs -d "$PWD/_site/docs"

      - name: Package repositories
        if: env.HAS_PACKAGES_KEY == 'true'
        env:
          # Private signing key of the package repositories, ASCII armored, no
          # passphrase
          PACKAGES_GPG_KEY: ${{ secrets.PACKAGES_GPG_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils createrepo-c rpm appstream appstream-compose flatpak ostree
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --import <<<"$PACKAGES_GPG_KEY"
          site/scripts/fetch-releases.sh "$RUNNER_TEMP/releases" 3
          site/scripts/build-repos.sh "$RUNNER_TEMP/releases" _site

      - name: No package repositories
        if: env.HAS_PACKAGES_KEY != 'true'
        run: echo "::warning::PACKAGES_GPG_KEY is not set, the site goes out without packages/"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
